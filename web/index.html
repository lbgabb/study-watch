<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习监督 · 仪表盘</title>
<style>
  :root{
    --bg:#0f1621; --panel:#18222f; --panel2:#1b2430; --line:#2a3a4d;
    --ink:#e8eef6; --dim:#8fa6bf; --faint:#6b7a8d;
    --amber:#ffd166; --green:#4cc97a; --blue:#5aa9e6; --violet:#9d7bea;
    --pink:#f2789f; --gray:#6b7a8d; --orange:#f2a65a; --cyan:#4dd0c1;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    font-size:14px; line-height:1.5;
  }
  a{color:var(--blue)}
  header{
    position:sticky; top:0; z-index:10; backdrop-filter:blur(8px);
    background:rgba(15,22,33,.88); border-bottom:1px solid var(--line);
    padding:12px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.5px}
  header h1 span{color:var(--amber)}
  .status{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--gray);box-shadow:0 0 0 0 rgba(76,201,122,.6)}
  .dot.on{background:var(--green); animation:pulse 2s infinite}
  .dot.off{background:var(--gray)}
  .dot.paused{background:var(--amber)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,201,122,.5)}70%{box-shadow:0 0 0 9px rgba(76,201,122,0)}100%{box-shadow:0 0 0 0 rgba(76,201,122,0)}}
  .spacer{flex:1}
  button{
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:7px 14px; font-size:13px; cursor:pointer;
    font-family:inherit; transition:.15s;
  }
  button:hover{border-color:#3d5470; background:#22303f}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.primary{background:#2f6f4f; border-color:#3c8a63}
  button.primary:hover{background:#377f5b}
  button.danger{background:#7a2f3a; border-color:#9a3d4a}
  button.danger:hover{background:#8b3644}
  main{padding:18px 22px 60px; max-width:1500px; margin:0 auto}
  .grid{display:grid; gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
  .two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .three{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px;
  }
  .card h2{
    margin:0 0 12px; font-size:13px; font-weight:600; color:var(--dim);
    display:flex; align-items:center; gap:8px; letter-spacing:.4px;
  }
  .card h2 .tag{font-size:11px;color:var(--faint);font-weight:400}
  .metric{font-size:27px; font-weight:600; line-height:1.15}
  .metric small{font-size:13px; color:var(--dim); font-weight:400; margin-left:6px}
  .sub{font-size:12px; color:var(--dim); margin-top:5px}
  .row{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .now{display:flex; gap:12px; align-items:flex-start}
  .now .badge{
    flex:none; padding:3px 9px; border-radius:999px; font-size:12px;
    background:#243447; color:var(--amber); border:1px solid #33465e;
  }
  .now .txt{font-size:15px}
  .now .basis{font-size:12px; color:var(--dim); margin-top:6px}
  svg{display:block; width:100%; height:auto; overflow:visible}
  /* 时间轴高度固定；宽度由 JS 按容器实际像素宽设 viewBox，保证坐标 = 真实像素 */
  #timeline svg{height:118px}
  /* 时间轴工具条：预设区间 / 自定义时间 / 提示 */
  .tlbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:2px 0 10px}
  .tlbar .spacer{flex:1}
  .tlseg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .tlseg button{border:none; border-radius:0; background:transparent; color:var(--dim);
                padding:5px 11px; font-size:12.5px}
  .tlseg button + button{border-left:1px solid var(--line)}
  .tlseg button:hover{background:#1c2836; color:var(--ink)}
  .tlseg button.on{background:#24384f; color:var(--ink)}
  .tlrange{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--faint)}
  .tlrange input[type=time]{background:#111a25; border:1px solid var(--line); border-radius:7px;
                            color:var(--ink); padding:4px 7px; font-size:12.5px; font-family:inherit}
  .tlrange input[type=time]:focus{outline:none; border-color:#3d5470}
  .tlrange button{padding:4px 10px; font-size:12.5px}
  #tlDay{background:#111a25; border:1px solid var(--line); border-radius:8px; color:var(--ink);
         padding:5px 8px; font-size:12.5px; font-family:inherit}
  #tlDay:focus{outline:none; border-color:#3d5470}
  .tlhint{font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
  #timeline svg{cursor:crosshair}
  .tlbrush{fill:rgba(120,170,235,.16); stroke:#78aaeb; stroke-width:1; stroke-dasharray:3 2}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-top:10px}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid #22303f; vertical-align:top}
  th{color:var(--faint); font-weight:500; font-size:12px}
  tr:last-child td{border-bottom:none}
  td.time{white-space:nowrap; color:var(--dim); font-variant-numeric:tabular-nums}
  td.cat{white-space:nowrap}
  .pill{padding:2px 8px; border-radius:999px; font-size:12px; background:#243447; color:var(--dim)}
  .pill.on{background:rgba(76,201,122,.16); color:var(--green)}
  .pill.off{background:rgba(242,120,159,.16); color:var(--pink)}
  .scroll{max-height:340px; overflow-y:auto; margin:-4px -6px 0}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:#2a3a4d; border-radius:4px}
  .empty{color:var(--faint); padding:22px 4px; text-align:center; font-size:13px}
  .warn{background:rgba(242,166,90,.1); border:1px solid rgba(242,166,90,.35); color:#f2c99a;
        padding:10px 14px; border-radius:9px; font-size:13px; margin-bottom:14px}
  .offlist{margin-top:6px; border-top:1px solid #22303f; padding-top:8px}
  .offrow{display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed #22303f; font-size:13px}
  .offrow:last-child{border-bottom:none}
  .offrow .t{color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums}
  .offrow .c{flex:none}
  .offrow .a{min-width:0}
  .offrow .a .b{color:var(--dim); font-size:12px; margin-top:3px;
                display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  /* 控制面板 */
  .cpanel{display:flex; flex-direction:column; gap:12px}
  .cstate{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
          background:var(--panel2); border:1px solid var(--line)}
  .cstate .big{width:12px; height:12px; border-radius:50%; flex:none; background:var(--gray)}
  .cstate.run .big{background:var(--green); animation:pulse 2s infinite}
  .cstate.paused .big{background:var(--amber)}
  .cstate .txt{font-size:15px; font-weight:600}
  .cstate .sub2{font-size:12px; color:var(--dim); margin-top:2px}
  .cbtns{display:flex; gap:9px; flex-wrap:wrap}
  .cbtns button{min-width:104px}
  .cnote{font-size:12px; color:var(--faint); line-height:1.6}
  .cmsg{font-size:12.5px; min-height:18px; color:var(--dim)}
  .ctl{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .ctl .hint{font-size:12px; color:var(--faint)}
  code{background:#111a25; border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12px}
  .kv{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed #22303f; font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv span:last-child{color:var(--dim); font-variant-numeric:tabular-nums}
  /* 设置抽屉（控制面板里点「打开设置」滑出） */
  .backdrop{position:fixed; inset:0; background:rgba(6,10,16,.62); opacity:0; pointer-events:none;
            transition:opacity .18s; z-index:40}
  .backdrop.show{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(580px,95vw); background:var(--panel);
          border-left:1px solid var(--line); z-index:41; display:flex; flex-direction:column;
          transform:translateX(102%); transition:transform .22s ease;
          box-shadow:-18px 0 44px rgba(0,0,0,.4)}
  .drawer.show{transform:none}
  .drawer .dhead{display:flex; align-items:center; gap:10px; padding:14px 18px;
                 border-bottom:1px solid var(--line)}
  .drawer .dhead h3{margin:0; font-size:15px}
  .drawer .dbody{overflow-y:auto; padding:16px 18px 6px; flex:1}
  .drawer .dfoot{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:10px;
                 align-items:center; flex-wrap:wrap}
  .drawer .dfoot .msg{flex:1; font-size:12.5px; color:var(--dim); min-width:160px}
  .sec{margin-bottom:20px}
  .sec > h4{margin:0 0 11px; font-size:13px; color:var(--amber); font-weight:600;
            display:flex; align-items:center; gap:8px}
  .sec > h4 .tag{color:var(--faint); font-weight:400; font-size:11px}
  .fld{margin-bottom:13px}
  .fld > label{display:block; font-size:12.5px; color:var(--dim); margin-bottom:5px}
  .fld label .badge{font-size:10.5px; padding:1px 6px; border-radius:999px; margin-left:6px;
                    background:#3a2f1a; color:var(--amber); border:1px solid #5a4a26}
  .fld label .badge.hot{background:#1c3328; color:var(--green); border-color:#2c5340}
  .fld input[type=text], .fld input[type=number], .fld input[type=password],
  .fld select, .fld textarea{
    width:100%; background:#111a25; border:1px solid var(--line); border-radius:7px;
    color:var(--ink); padding:8px 10px; font-size:13px; font-family:inherit}
  .fld textarea{min-height:62px; resize:vertical}
  .fld input:focus, .fld select:focus, .fld textarea:focus{outline:none; border-color:#3d5470}
  .fld .hint{font-size:11.5px; color:var(--faint); margin-top:4px}
  .fld .inline{display:flex; gap:8px; align-items:center}
  .fld .inline input[type=text]{flex:1}
  .sw{display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none}
  .sw input{width:16px; height:16px; margin:0; accent-color:#3c8a63}
  .keyline{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:9px;
           padding:9px 11px; background:var(--panel2); border-radius:8px; border:1px solid var(--line)}
  .keyline .dot2{width:9px; height:9px; border-radius:50%; background:var(--green); flex:none}
  .keyline .dot2.no{background:var(--pink)}
  .keyline .src{color:var(--dim); font-size:12px; margin-left:auto}
  @media(max-width:980px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>学习监督 <span>仪表盘</span></h1>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">读取中…</span>
  </div>
  <div class="spacer"></div>
  <span class="status" id="updated"></span>
  <button id="btnRefresh">刷新</button>
</header>

<main>
  <div id="warnBox"></div>

  <div class="grid cards" id="cards"></div>

  <div class="card" style="margin-top:14px">
    <h2>时间轴 <span class="tag" id="tlTag"></span></h2>
    <div class="tlbar">
      <select id="tlDay" title="选择要查看的日期"></select>
      <div class="tlseg" id="tlPresets"></div>
      <div class="tlrange">
        <input type="time" id="tlFrom" step="60" title="起始时间">
        <span>→</span>
        <input type="time" id="tlTo" step="60" title="结束时间">
        <button id="tlApply">应用</button>
      </div>
      <div class="spacer"></div>
      <span class="tlhint" id="tlHint"></span>
      <button id="tlReset" title="回到全天视图">重置</button>
    </div>
    <div id="timeline"></div>
    <div class="legend" id="tlLegend"></div>
  </div>

  <div class="grid two" style="margin-top:14px">
    <div class="card">
      <h2>分心记录 <span class="tag" id="offTag"></span></h2>
      <div class="ctl" style="margin-bottom:6px">
        <label class="switch" style="font-size:12px">
          <input type="checkbox" id="offFollow">
          <span>跟随时间轴区间</span>
        </label>
      </div>
      <div class="offlist" id="offlist"></div>
    </div>
    <div class="card">
      <h2>类别占比</h2>
      <div id="donut"></div>
      <div class="legend" id="donutLegend"></div>
    </div>
  </div>

  <div class="grid three" style="margin-top:14px">
    <div class="card">
      <h2>近 7 天</h2>
      <div id="week"></div>
      <div class="legend"><span><i style="background:var(--green)"></i>在状态</span><span><i style="background:var(--pink)"></i>分心</span></div>
    </div>
    <div class="card">
      <h2>分心来源</h2>
      <div id="procs"></div>
    </div>
    <div class="card">
      <h2>运行概况</h2>
      <div id="meta"></div>
    </div>
  </div>

  <div class="grid two" style="margin-top:14px">
    <div class="card">
      <h2>最近判定 <span class="tag" id="recentTag"></span></h2>
      <div class="scroll"><table id="recent"></table></div>
    </div>
    <div class="card">
      <h2>控制面板 <span class="tag">开 / 停 / 暂停都由这里控制</span></h2>
      <div class="cpanel">
        <div class="cstate" id="cstate">
          <div class="big"></div>
          <div>
            <div class="txt" id="cstateText">读取中…</div>
            <div class="sub2" id="cstateSub"></div>
          </div>
        </div>
        <div class="cbtns" id="cbtns"></div>
        <div class="cmsg" id="ctlMsg"></div>
        <div class="cnote" id="cnote"></div>
      </div>
    </div>
  </div>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="dhead">
    <h3>设置</h3>
    <span class="sub" id="cfgPath" style="font-size:11.5px"></span>
    <div class="spacer" style="flex:1"></div>
    <button id="btnCloseDrawer">关闭</button>
  </div>
  <div class="dbody" id="cfgBody"></div>
  <div class="dfoot">
    <button class="primary" id="btnSaveCfg">保存设置</button>
    <button id="btnTestApi">测试 API 连通</button>
    <button id="btnReloadCfg">放弃修改</button>
    <div class="msg" id="cfgMsg"></div>
  </div>
</aside>

<script src="/app.js"></script>
</body>
</html>
