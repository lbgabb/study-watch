<!doctype html>
<meta charset="utf-8">
<title>学习监督 桌宠</title>
<!--
  独立桌宠窗口（浏览器 app 模式加载本页）。

  与仪表盘里的桌宠是同一套模型、同一套判断，区别只在于：
    · 本页只有桌宠，没有图表与时间轴 —— 窗口小、开销低
    · 用自己的轻量接口 /api/pet，不拉整天数据
    · 无标题栏、置顶、可拖动

  透明背景：style=colorkey 时页面铺一个纯色（默认 #010203），
  由 lib/pet_window.py 用 Windows 颜色键把它整片挖掉。
  代价是抗锯齿边缘会留同色硬边，所以默认走 solid。
-->
<style>
  :root { --ink:#e8eef6; --dim:#8fa6bf; --line:#33465e; --bg:#1b2430; }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font:13px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:transparent;
    user-select:none;
  }
  /* 颜色键模式下用这个纯色铺满，窗口创建后会被整片抠掉 */
  body.colorkey { background:#010203; }
  #root {
    width:100%; height:100%; display:flex; flex-direction:column;
    background:transparent;
  }
  body.solid #root {
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:12px;
  }
  /* 顶栏：拖动区 + 关闭按钮。app 模式没有标题栏，所以自己做一个。 */
  #bar {
    height:26px; flex:none; display:flex; align-items:center;
    padding:0 8px; gap:6px;
    -webkit-app-region:drag;        /* 整条作为拖动区 */
    cursor:move;
  }
  body.solid #bar { border-bottom:1px solid var(--line); }
  #bar .dot { width:7px; height:7px; border-radius:50%; background:#4cc97a; flex:none; }
  #bar .title { flex:1; font-size:11px; color:var(--dim); }
  #bar .btn {
    -webkit-app-region:no-drag;     /* 按钮要能点，不能算拖动区 */
    width:18px; height:18px; border-radius:5px; border:none;
    background:#3d4a5c; color:#cdd8e5; font-size:12px; line-height:1;
    cursor:pointer; padding:0;
  }
  #bar .btn:hover { background:#4b5b70; }
  #stage { flex:1; min-height:0; position:relative; }
  #stage canvas { display:block; width:100%; height:100%; }
  #say {
    flex:none; margin:0 8px 8px; padding:6px 9px; min-height:34px;
    border-radius:9px; font-size:12px; line-height:1.45;
    background:rgba(31,43,58,.92); border:1px solid var(--line);
  }
  body.colorkey #say { background:rgba(20,28,38,.86); }
  #hint { font-size:10.5px; color:var(--dim); text-align:center; padding:0 8px 6px; }
  /* 计划控制条：桌宠这边也能开始/暂停/结束专注，不必再开仪表盘 */
  #planbar {
    flex:none; display:flex; gap:5px; align-items:center;
    padding:0 8px 6px; flex-wrap:wrap;
  }
  #planbar button {
    -webkit-app-region:no-drag;
    font:11.5px/1 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    padding:5px 9px; border-radius:7px; border:1px solid var(--line);
    background:#2a3a4d; color:#dbe4ee; cursor:pointer;
  }
  #planbar button:hover { background:#35485e; }
  #planbar button.primary { background:#2f6f4f; border-color:#3d8a63; color:#fff; }
  #planbar button.warn { background:#5a3a3a; border-color:#7a4a4a; }
  #planbar .pinfo { font-size:10.5px; color:var(--dim); margin-left:auto; }
  /* 右键菜单：逐个试表情与动作（方便看全模型能力） */
  #menu {
    position:fixed; z-index:50; display:none;
    background:#1f2b3a; border:1px solid var(--line); border-radius:9px;
    padding:5px; box-shadow:0 6px 20px rgba(0,0,0,.45);
    max-height:78vh; overflow:auto; width:186px;
    -webkit-app-region:no-drag;
  }
  #menu.on { display:block; }
  #menu .h {
    font-size:10.5px; color:var(--dim); padding:4px 7px 2px;
    border-top:1px solid var(--line); margin-top:3px;
  }
  #menu .h:first-child { border-top:none; margin-top:0; }
  #menu button {
    display:block; width:100%; text-align:left; font-size:11.5px;
    padding:4px 8px; border:none; border-radius:6px;
    background:transparent; color:#dbe4ee; cursor:pointer; position:relative; z-index:1;
  }
  #menu button:hover { background:#2f3f52; }
  #menu button.on { background:#2f6f4f; color:#fff; }
</style>

<div id="root">
  <div id="bar">
    <span class="dot"></span>
    <span class="title">鲸鱼娘</span>
    <button class="btn" id="bMute" title="静音 / 取消静音">♪</button>
    <button class="btn" id="bHide" title="收起（暂时不显示）">–</button>
    <button class="btn" id="bClose" title="关掉桌宠窗口">×</button>
  </div>
  <div id="stage"><canvas id="pet"></canvas></div>
  <div id="planbar"></div>
  <div id="say">正在把鲸鱼娘请出来…</div>
  <div id="hint">拖动顶栏移动 · 点角色摸摸头 · 双击催一句 · <b>右键试所有表情与动作</b></div>
</div>
<div id="menu"></div>

<script src="/vendor/live2dcubismcore.min.js"></script>
<script src="/vendor/pixi.min.js"></script>
<script src="/vendor/cubism4.min.js"></script>
<script src="/pet.js"></script>
</body>
